# language: YAML, file: .github/workflows/build.yml
name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Theos & SDKs
      run: |
        git clone --recursive https://github.com/theos/theos.git /opt/theos
        git clone https://github.com/theos/sdks.git /opt/theos/sdks

    - name: Run Make Compilation
      run: |
        make

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: antiban-eri-dylib
        path: .theos/obj/*.dylib
