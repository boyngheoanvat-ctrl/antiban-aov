# language: YAML, file: .github/workflows/build.yml
name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Theos & SDKs
      run: |
        if [ ! -d "/opt/theos" ]; then
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
        fi
        if [ ! -d "/opt/theos/sdks" ]; then
          sudo git clone https://github.com/theos/sdks.git /opt/theos/sdks
        fi
        sudo chown -R $USER /opt/theos

    - name: Install Dependencies (ldid)
      run: |
        brew install ldid

    - name: Run Make Compilation
      run: |
        make

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: antiban-eri-dylib
        path: .theos/obj/*.dylib
