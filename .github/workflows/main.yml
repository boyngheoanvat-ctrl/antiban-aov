name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git /opt/theos
        # Cài đặt iOS SDK cần thiết nếu chưa có sẵn
        sudo git clone https://github.com/theos/sdks.git /opt/theos/sdks

    - name: Run Make
      run: |
        make
